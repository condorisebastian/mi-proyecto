name: transita_bolivia
description: "Mi Pasaje - App unificada de transporte para pasajeros y conductores"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.0.0
  http: ^1.1.0
  shared_preferences: ^2.2.0
  qr_flutter: ^4.1.0
  intl: ^0.18.0
  mobile_scanner: ^7.4.0
  firebase_core: ^4.14.0
  cloud_firestore: ^6.9.0
  url_launcher: ^6.3.2
  firebase_auth: ^6.7.0
  share_plus: ^10.1.4
  flutter_tts: ^4.2.5
  cloud_functions: ^6.5.0
  firebase_app_check: ^0.4.8

dev_dependencies:
  fake_cloud_firestore: ^4.3.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_app_new.png
    - assets/images/student_card_updated.png
    - assets/images/icono_saldo.png
    - assets/images/descubre_recarga.png
    - assets/images/descubre_recarga_otros.png
    - assets/images/descubre_saldo.png
    - assets/images/descubre_pago_tarjeta.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/launcher_icon.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/branding/launcher_icon.png"
  adaptive_icon_foreground_inset: 16
  remove_alpha_ios: true
  background_color_ios: "#1E88E5"
